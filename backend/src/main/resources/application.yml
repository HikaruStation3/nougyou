server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nougyou-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:nougyou}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      # 短视频按接口文档限制 100MB（API-113），单请求略放宽以容纳表单字段
      max-file-size: 100MB
      max-request-size: 110MB
  mvc:
    async:
      # SSE 流式对话为长连接，避免默认 30s 超时
      request-timeout: 180000
  ai:
    openai:
      # 智谱 GLM 提供 OpenAI 兼容接口
      api-key: ${GLM_API_KEY:这里填智谱ai的key}
      base-url: ${GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      chat:
        # GLM 的对话路径为 /api/paas/v4/chat/completions
        completions-path: /chat/completions
        options:
          model: ${GLM_MODEL:glm-4-flash}
          temperature: 0.7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:nougyou}

nougyou:
  jwt:
    # 生产环境务必通过环境变量覆盖，长度不少于 32 字节
    secret: ${JWT_SECRET:nougyou-jwt-secret-key-change-me-0123456789abcdef}
    access-token-expire-minutes: 120
    refresh-token-expire-days: 7
  file:
    # MinIO 不可用时的本地兜底目录，由 MediaResourceConfig 映射为 /api/v1/files/local/**
    local-dir: ${LOCAL_UPLOAD_DIR:./uploads}
  captcha:
    # 登录是否校验图形验证码
    enabled: true
  ai:
    # AI 客服对话参数
    model-name: ${GLM_MODEL:glm-4-flash}
    # 携带的历史消息条数（一问一答算 2 条）
    history-size: 10
    # SSE 超时（毫秒）
    timeout-ms: 180000
    # 单次提问最大字数
    max-question-length: 1000

alipay:
  # 支付宝沙箱（电脑网站支付）。三个密钥填齐并置 enabled: true 后，
  # 订单页才会出现「支付宝沙箱」入口；否则只保留模拟支付，不影响其它功能演示。
  enabled: false
  sandbox: true
  gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  # 沙箱应用 APPID，形如 9021000xxx（开放平台 → 控制台 → 沙箱）
  app-id: ${ALIPAY_APP_ID:}
  # 应用私钥：支付宝密钥工具生成的 PKCS8 单行 Base64
  private-key: ${ALIPAY_PRIVATE_KEY:}
  # 支付宝公钥：沙箱应用页里的「支付宝公钥」，不是应用公钥
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # 异步通知需公网可达；本机开发填 localhost 不会被调用，靠前端跳回后主动查单兜底
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/v1/pay/alipay/notify}
  # 同步跳转由浏览器发起，填本机前端地址即可
  return-url: ${ALIPAY_RETURN_URL:http://localhost:3100/#/pay/result}
  subject-prefix: 钟山镇扶贫助农-

logging:
  level:
    com.nougyou: info
